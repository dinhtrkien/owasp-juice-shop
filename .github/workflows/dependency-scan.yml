name: SBOM and Image Security Scan

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/hoang_anh
      - dev

jobs:

  sca-with-snyk:
    name: SCA Snyk Scan
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependancy
        run: npm ci --legacy-peer-deps
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env: 
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with: 
          command: test
          args: --sarif-file-output=snyk.sarif
      
      - name: DEBUG Verify snyk.sarif file exists
        run: |
          echo "Kiểm tra sự tồn tại của file snyk.sarif:"
          ls -l snyk.sarif
        
      - name: Upload result to Github Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'SARIF'
        # Chúng ta biết chắc file sẽ được tạo ra trong thư mục này
          out: './reports'
          args: >
             --exclude "**/frontend/dist/**"
             --exclude "**/ftp/**"
             --exclude "**/owasp_promo.vtt"
             --exclude "**/legal.md"
    
   
      - name: Upload OWASP Dependency-Check results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: './reports/dependency-check-report.sarif'
          category: owasp-dependency-check
  
  generate-sbom:
    name: Generate SBOM and Scan
    runs-on: ubuntu-latest 
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate SBOM with Syft 
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.json" 
      - name: Run Grype vulnerability scanner on sbom 
    # Sử dụng action chính thức của Grype
        id: grype-scan
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          path: '.'
          output-format: 'SARIF'
      - name: Upload Result to Tab Security Scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

  
  build-image-and-test:
    name: Build Docker Image And Test Dependancy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read 
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: | 
           docker build . -t juiceshop:latest
      - name: Scan for SARIF Report
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: 'juiceshop:latest'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Scan and Print Table to Log
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: 'juiceshop:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'







      
