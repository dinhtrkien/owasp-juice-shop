name: "Enhanced Security Pipeline"

on:
  push:
    branches:
      - dev # Deploy to staging
      - main # Deploy to production
      - feature/som # Som tests full pipeline integration
  pull_request:
    branches:
      - dev
  workflow_dispatch: # Manual trigger for testing
env:
  NODE_VERSION: 22
  IMAGE_TO_SCAN: dinhtrkien/owasp-juice-shop:latest
jobs:

  sca-with-snyk:
    name: SCA Snyk Scan
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependancy
        run: npm ci --legacy-peer-deps
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env: 
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with: 
          command: test
          args: --sarif-file-output=snyk.sarif
      
      - name: DEBUG Verify snyk.sarif file exists
        run: |
          echo "Kiểm tra sự tồn tại của file snyk.sarif:"
          ls -l snyk.sarif
        
      - name: Upload result to Github Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'SARIF'
        # Chúng ta biết chắc file sẽ được tạo ra trong thư mục này
          out: './reports'
          args: >
             --exclude "**/frontend/dist/**"
             --exclude "**/ftp/**"
             --exclude "**/owasp_promo.vtt"
             --exclude "**/legal.md"
    
   
      - name: Upload OWASP Dependency-Check results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: './reports/dependency-check-report.sarif'
          category: owasp-dependency-check
  
  generate-sbom:
    name: Generate SBOM and Scan
    runs-on: ubuntu-latest 
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate SBOM with Syft 
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.json" 
      - name: Run Grype vulnerability scanner on sbom 
    # Sử dụng action chính thức của Grype
        id: grype-scan
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          path: '.'
          output-format: 'SARIF'
      - name: Upload Result to Tab Security Scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

  
  build-image-and-test:
    name: Build Docker Image And Test Dependancy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read 
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: | 
           docker build . -t juiceshop:latest
      - name: Scan for SARIF Report
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: 'juiceshop:latest'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Scan and Print Table to Log
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: 'juiceshop:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  hadolint:
    name: "Hadolint - Dockerfile Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Juice Shop
        run: |
          docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
          sleep 40

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-results
          chmod 777 zap-results
          docker run --user root --network="host" \
            -v ${{ github.workspace }}/zap-results:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-DAST-Report
          path: zap-results/zap-report.html

  semgrep:
    name: "Semgrep - Code Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true # Don't fail pipeline
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  sonarcloud:
    name: "SonarCloud - Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        continue-on-error: true
        run: npm test 2>&1 || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=your-team_juice-shop
            -Dsonar.organization=your-team-org

  secret-scanning:
    name: "TruffleHog - Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
        
  deploy-to-aws-ec2:
    name: "Deploy to AWS ${{ inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ inputs.environment == 'production' && 'https://prod.your-team.juice-shop.com' || 'https://staging.your-team.juice-shop.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t dinhtrkien/owasp-juice-shop:latest \
                       -t dinhtrkien/owasp-juice-shop:${{ github.sha }} \
                       -t dinhtrkien/owasp-juice-shop:${{ inputs.environment || 'staging' }} .

      - name: Push image to Docker Hub
        run: |
          echo "📤 Pushing Docker image to Docker Hub..."
          docker push dinhtrkien/owasp-juice-shop:latest
          docker push dinhtrkien/owasp-juice-shop:${{ github.sha }}
          docker push dinhtrkien/owasp-juice-shop:${{ inputs.environment || 'staging' }}

      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deploying to EC2..."

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest image
            docker pull dinhtrkien/owasp-juice-shop:latest

            # Stop and remove old container
            docker stop juice-shop || true
            docker rm juice-shop || true

            # Run new container
            docker run -d --name juice-shop -p 80:3000 dinhtrkien/owasp-juice-shop:latest

            echo "✅ Container started successfully"

      # - name: Health check
      #   run: |
      #     echo "🏥 Performing health check..."
      #     sleep 10

      #     # Check if deployment is healthy
      #     DEPLOY_URL="${{ inputs.environment == 'production' && secrets.PROD_URL || secrets.STAGING_URL }}"

      #     if [ ! -z "$DEPLOY_URL" ]; then
      #       curl -f $DEPLOY_URL/rest/admin/application-version || echo "⚠️ Health check needs configuration"
      #     fi

      #     echo "✅ Deployment health check completed"

      - name: Post deployment summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Environment: ${{ inputs.environment || 'staging' }}"
          echo "Docker Image: dinhtrkien/owasp-juice-shop:latest"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "===================="
