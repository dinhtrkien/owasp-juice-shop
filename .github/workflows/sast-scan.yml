name: "SAST Scanning"

# Truong's workflow - Static Application Security Testing
# This workflow is called by security-enhanced.yml OR can run independently

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/truong

jobs:
  sonarqube_scan:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: sqp_98f75b5f48677f259cebcc3fbc1765544040c724
          SONAR_HOST_URL: http://34.238.49.167:9000
        with:
          args: >
            -Dsonar.projectKey=juice-shop
            -Dsonar.projectName=juice-shop


