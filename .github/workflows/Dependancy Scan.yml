name: SBOM and Image Security Scan

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/hoang_anh

jobs:
  sca-with-snyk:
    name: SCA Synk Scan
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install Dependancy
        run: npm ci --legacy-peer-deps
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env: 
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with: 
          command: test
          args: --sarif-file-output=snyk.sarif
        
      - name: Upload result to Github Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success()
        with:
          sarif_file: snyk.sarif

  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # Sử dụng action này chỉ để cài đặt công cụ và cập nhật DB.
      - name: Install OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          scan-args: "--version" # Chạy lệnh nhanh để hoàn tất cài đặt

      - name: Run Dependency-Check Scan Command
        id: DepCheck # Đặt ID để lấy output
        run: |
          dependency-check.sh \
            --project "${{ github.event.repository.name }}" \
            --scan "." \
            --format "SARIF" \
            --out "." \
            --exclude "**/frontend/dist/**" \
            --exclude "**/ftp/**"
          # Đặt đường dẫn đến tệp sarif vào step output
          echo "sarif_file=dependency-check-report.sarif" >> $GITHUB_OUTPUT
        # Vẫn bật để không dừng pipeline nếu có lỗi, nhưng giờ lỗi zip slip đã được xử lý
        continue-on-error: true
      
    
      - name: Upload OWASP results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: owasp-dependency-check
          sarif_file: ${{ steps.DepCheck.outputs.sarif_file }}
      
      

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate SBOM with Syft 
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.json" 
      - name: Upload SBOM Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

  scan-sbom-grype:
    name: Scan Sbom Grype
    runs-on: ubuntu-latest
    needs: generate-sbom
    
    steps:
      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scanner on sbom
    # Sử dụng action chính thức của Grype
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          sbom: "sbom.json"
          output-format: table
      
