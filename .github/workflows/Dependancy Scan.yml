name: SBOM and Image Security Scan

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/hoang_anh

jobs:
  sca-with-snyk:
    name: SCA Synk Scan
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install Dependancy
        run: npm ci --legacy-peer-deps
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env: 
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with: 
          command: test
          args: --sarif-file-output=snyk.sarif
        
      - name: Upload result to Github Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success()
        with:
          sarif_file: snyk.sarif
  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    permissions:
    # Bắt buộc phải có quyền này để upload kết quả lên tab Security
      security-events: write
    # Quyền đọc code để checkout
      contents: read
    
    steps:
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: DepCheck
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'SARIF'
          out: './reports'
          args: >
            --exclude "**/frontend/dist/**"
            --exclude "**/ftp/**"
            --exclude "**/owasp_promo.vtt"
            --exclude "**/legal.md"
      - name: Check the output variable
        run: | 
          echo "Giá trị của steps.DepCheck.outputs.sarif_file là:"
          echo "'${{ steps.DepCheck.outputs.sarif_file }}'"
      - name: 📂 [DEBUG] Check if report file exists
        run: |
          echo "Liệt kê tất cả các file trong thư mục reports:"
          ls -R ./reports
      # Luôn chạy step này để kiểm tra, kể cả khi step trước đó có vấn đề
        if: always()

          
      - name: Upload OWASP Dependency-Check results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.DepCheck.outputs.sarif_file }}
          category: owasp-dependency-check
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate SBOM with Syft 
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.json" 
      - name: Upload SBOM Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

  scan-sbom-grype:
    name: Scan Sbom Grype
    runs-on: ubuntu-latest
    needs: generate-sbom
    
    steps:
      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scanner on sbom
    # Sử dụng action chính thức của Grype
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          sbom: "sbom.json"
          output-format: table
      
