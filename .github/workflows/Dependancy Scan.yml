name: SBOM and Image Security Scan

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/hoang_anh

jobs:
  # ------ JOB 1: CHUẨN BỊ MÔI TRƯỜNG ------
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Cache Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm' # Cache tích hợp sẵn của setup-node

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Lưu lại node_modules để các job sau sử dụng
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

  # ------ JOB 2: QUÉT VỚI SNYK (SCA) ------
  snyk-sca-scan:
    name: Snyk Dependency Scan (SCA)
    runs-on: ubuntu-latest # <-- THAY ĐỔI Ở ĐÂY
    needs: prepare
    permissions:
      security-events: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          
      # Khôi phục node_modules từ cache
      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          # Thêm restore-keys để tăng khả năng tìm thấy cache
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --sarif-file-output=snyk-sca-results.sarif
      
      - uses: github/codeql-action/upload-sarif@v3
        with:
          category: snyk-sca-scan
          sarif_file: snyk-sca-results.sarif

  # ------ JOB 3: QUÉT VỚI OWASP DEPENDENCY-CHECK ------
  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest # <-- THAY ĐỔI Ở ĐÂY
    needs: prepare
    permissions:
      security-events: write
      
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run OWASP Dependency-Check
        id: DepCheck
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'juice-shop'
          scan: '.' 
          format: 'SARIF'
      
      - name: Upload OWASP Dependency-Check results
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: owasp-dependency-check
          sarif_file: ${{ steps.DepCheck.outputs.sarif_file }}