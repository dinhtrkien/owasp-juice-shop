name: SBOM and Image Security Scan

on:
  workflow_call: # Called by main pipeline
  workflow_dispatch: # Can be triggered manually
  push:
    branches:
      - feature/hoang_anh

jobs:
  sca-with-snyk:
    name: SCA Synk Scan
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install Dependancy
        run: npm ci --legacy-peer-deps
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env: 
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with: 
          command: test
          args: --sarif-file-output=snyk.sarif
        
      - name: Upload result to Github Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success()
        with:
          sarif_file: snyk.sarif
  owasp-dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    permissions:
    # Bắt buộc phải có quyền này để upload kết quả lên tab Security
      security-events: write
    # Quyền đọc code để checkout
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

    # Chạy OWASP Dependency-Check trong một bước duy nhất
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: DepCheck # Đặt ID để lấy output từ action này
        with:
        # Tên dự án, sẽ hiển thị trong báo cáo
          project: '${{ github.event.repository.name }}'
        # Đường dẫn cần quét. '.' có nghĩa là quét toàn bộ thư mục gốc
          path: '.'
        # Định dạng output. SARIF là định dạng để tích hợp với GitHub Security
          format: 'SARIF'
        # Thư mục để lưu báo cáo. Action sẽ tự động tạo thư mục này nếu chưa có
          out: './reports'
        # Thêm các tham số khác không có input trực tiếp thông qua 'args'
        # Mỗi tham số và giá trị của nó nên được đặt trong dấu ngoặc kép riêng
          args: >
            --exclude "**/frontend/dist/**"
            --exclude "**/ftp/**"
    
      - name: Upload OWASP Dependency-Check results to GitHub Security
        # Chỉ chạy bước này nếu bước trước thành công
        if: success()
        uses: github/codeql-action/upload-sarif@v3
        with:
        # Action dependency-check tự động cung cấp đường dẫn đến file SARIF qua output
          sarif_file: ${{ steps.DepCheck.outputs.sarif_file }}
        # Tùy chọn: đặt category để phân biệt các công cụ quét khác nhau
          category: owasp-dependency-check

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate SBOM with Syft 
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.json" 
      - name: Upload SBOM Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

  scan-sbom-grype:
    name: Scan Sbom Grype
    runs-on: ubuntu-latest
    needs: generate-sbom
    
    steps:
      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scanner on sbom
    # Sử dụng action chính thức của Grype
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          sbom: "sbom.json"
          output-format: table
      
