name: ZAP DAST Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pull Juice Shop image
      run: docker pull bkimminich/juice-shop

    - name: Run Juice Shop
      run: |
        docker run -d -p 3000:3000 bkimminich/juice-shop
        sleep 60

    - name: Run OWASP ZAP Baseline Scan
      run: |
        mkdir zap-results
        docker run --network host -v $(pwd)/zap-results:/zap/wrk ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -r zap-report.html

    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      with:
        name: ZAP-DAST-Report
        path: zap-results/zap-report.html
        #test
