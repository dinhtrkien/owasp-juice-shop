# BẮT BUỘC: Đặt tên cho toàn bộ workflow
name: Scan Image on Staging EC2

# Kích hoạt workflow khi có push lên các nhánh bắt đầu bằng 'feature/'
on:
  push:
    branches: 
      - 'feature/hoang_anh'

env:
  IMAGE_TO_SCAN: dinhtrkien/owasp-juice-shop:latest

jobs:
  # ------ JOB 1: Quét bằng TRIVY ------
  trivy-scan:
    name: Scan with Trivy on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH to EC2 and run Trivy scan
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Checking disk space before scan ---"
            df -h
            
            echo "--- Cleaning up unused Docker resources ---"
            docker system prune -af || true
            
            set -e # Dừng ngay lập tức nếu có lỗi

            echo "🚀 Scanning ${{ env.IMAGE_TO_SCAN }} with Trivy..."

            # 1. Cài đặt Trivy nếu cần
            if ! command -v trivy &> /dev/null
            then
                echo "Trivy not found. Installing now..."
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
            fi

            # 2. Chạy Trivy scan
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              ${{ env.IMAGE_TO_SCAN }}
            
            echo "✅ Trivy scan completed successfully."

  snyk-scan:
    name: Scan with Snyk on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH to EC2 and run Snyk scan
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export SNYK_TOKEN=${{ secrets.SNYK_TOKEN }}
            set -e # Dừng ngay lập tức nếu có lỗi

            echo "🚀 Scanning ${{ env.IMAGE_TO_SCAN }} with Snyk..."
            
            if ! command -v npm &> /dev/null
            then
                echo "NPM not found. Installing Node.js and NPM..."
                # Lệnh cài đặt cho Amazon Linux 2
                # Sử dụng nvm (Node Version Manager) là cách tốt nhất
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
                # Kích hoạt nvm mà không cần đăng xuất/đăng nhập lại
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                # Cài đặt phiên bản Node.js LTS (Long Term Support) mới nhất
                nvm install --lts
                echo "✅ Node.js and NPM installed successfully."
            fi
            
            # 1. Cài đặt Snyk nếu cần
            if ! command -v snyk &> /dev/null
            then
                echo "Snyk not found. Installing via npm..."
                # Bây giờ lệnh này sẽ hoạt động
                npm install -g snyk
                # Kích hoạt lại nvm để shell biết Snyk ở đâu
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            # 2. Chạy Snyk scan
            echo "Snyk Scan OS & Kernel"
            snyk test --os --severity-threshold=high --json=false
            
         
