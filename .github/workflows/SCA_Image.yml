# BẮT BUỘC: Đặt tên cho toàn bộ workflow
name: Scan Image on Staging EC2

# Kích hoạt workflow khi có push lên nhánh 'feature/hoang_anh'
on:
  push:
    branches: 
      - 'feature/hoang_anh'

# Định nghĩa các biến môi trường dùng chung cho tất cả các job
env:
  # Dễ dàng thay đổi image cần quét ở đây
  IMAGE_TO_SCAN: dinhtrkien/owasp-juice-shop:latest

jobs:
  # ------ JOB 1: Quét bằng TRIVY ------
  trivy-scan:
    name: Scan with Trivy on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH to EC2 and run Trivy scan
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user # Username mặc định cho Amazon Linux
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Checking disk space on EC2 ---"
            df -h
            echo "------------------------------"
            set -e # Dừng ngay lập tức nếu có lỗi

            echo "🚀 Connecting to EC2 to scan ${{ env.IMAGE_TO_SCAN }} with Trivy..."

            # 1. Cài đặt Trivy nếu cần
            if ! command -v trivy &> /dev/null
            then
                echo "Trivy not found. Installing now..."
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
                echo "✅ Trivy installed."
            else
                echo "👍 Trivy is already installed."
            fi

            # 2. Chạy Trivy scan
            echo "🔍 Running Trivy scan..."
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              ${{ env.IMAGE_TO_SCAN }}
            
            echo "✅ Trivy scan completed successfully."

  # ------ JOB 2: Quét bằng SNYK ------
  # Job này sẽ chạy SONG SONG với job trivy-scan
  snyk-scan:
    name: Scan with Snyk on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH to EC2 and run Snyk scan
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user # Username mặc định cho Amazon Linux
          key: ${{ secrets.EC2_SSH_KEY }}
          # Truyền SNYK_TOKEN vào script để Snyk CLI có thể sử dụng
          script: |
            set -e # Dừng ngay lập tức nếu có lỗi

            echo "🚀 Connecting to EC2 to scan ${{ env.IMAGE_TO_SCAN }} with Snyk..."

            # 1. Cài đặt Snyk nếu cần (yêu cầu Node.js/npm trên EC2)
            if ! command -v snyk &> /dev/null
            then
                echo "Snyk not found. Installing via npm..."
                # LƯU Ý: Đảm bảo EC2 của bạn đã cài Node.js và npm
                sudo npm install -g snyk
                echo "✅ Snyk installed."
            else
                echo "👍 Snyk is already installed."
            fi

            # 2. Chạy Snyk scan (không cần 'snyk auth' nếu có SNYK_TOKEN)
            echo "🔍 Running Snyk scan..."
            snyk container test ${{ env.IMAGE_TO_SCAN }} --severity-threshold=high
            
            echo "✅ Snyk scan completed successfully."
        env:
          # Cách truyền secret vào môi trường của script SSH
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}