# Dat's workflow - Container and Image Security
# This workflow is called by security-enhanced.yml OR can run independently

name: "Image Scanning"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - feature/dat
      - dev

permissions:
  security-events: write

jobs:
  trivy-scan:
    name: "Trivy - Image Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:scan .

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "juice-shop:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  grype-scan:
    name: "Grype - Vulnerability Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:scan .

      - name: Scan with Grype
        uses: anchore/scan-action@v3
        id: grype
        continue-on-error: true
        with:
          image: "juice-shop:scan"
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
